<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b6cf5"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Ambient glow -->
  <ellipse cx="480" cy="120" rx="180" ry="100" fill="#3b6cf5" opacity="0.12" filter="url(#glow)"/>
  <ellipse cx="160" cy="380" rx="120" ry="80" fill="#14b8a6" opacity="0.08" filter="url(#glow)"/>
  <!-- Main dashboard frame -->
  <g filter="url(#soft-shadow)" transform="perspective(800) rotateY(-8deg)">
    <rect x="80" y="60" width="480" height="380" rx="16" fill="url(#hero-bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Top bar -->
    <rect x="80" y="60" width="480" height="48" rx="16" fill="#161922"/>
    <rect x="80" y="92" width="480" height="16" fill="#161922"/>
    <circle cx="108" cy="84" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="128" cy="84" r="6" fill="#eab308" opacity="0.8"/>
    <circle cx="148" cy="84" r="6" fill="#22c55e" opacity="0.8"/>
    <rect x="200" y="76" width="120" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
    <!-- KPI row -->
    <rect x="100" y="120" width="100" height="72" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="110" y="132" width="50" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="110" y="150" width="70" height="20" rx="4" fill="url(#hero-accent)" opacity="0.9"/>
    <rect x="220" y="120" width="100" height="72" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="230" y="132" width="45" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="230" y="150" width="55" height="20" rx="4" fill="#14b8a6" opacity="0.85"/>
    <rect x="340" y="120" width="100" height="72" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="350" y="132" width="55" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="350" y="150" width="60" height="20" rx="4" fill="#d4a012" opacity="0.85"/>
    <rect x="460" y="120" width="80" height="72" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="470" y="132" width="40" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="470" y="150" width="50" height="20" rx="4" fill="#3b6cf5" opacity="0.85"/>
    <!-- Chart area -->
    <rect x="100" y="210" width="280" height="140" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="115" y="225" width="80" height="10" rx="2" fill="rgba(255,255,255,0.15)"/>
    <path d="M120 320 L160 280 L200 300 L240 250 L280 270 L320 220 L360 240" stroke="url(#hero-accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 320 L160 290 L200 310 L240 270 L280 285 L320 250 L360 265 L360 340 L120 340 Z" fill="url(#hero-accent)" opacity="0.15"/>
    <!-- Queue panel -->
    <rect x="400" y="210" width="140" height="140" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="415" y="225" width="60" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="415" y="245" width="110" height="28" rx="6" fill="rgba(59,108,245,0.2)" stroke="rgba(59,108,245,0.3)"/>
    <rect x="415" y="282" width="110" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="415" y="319" width="110" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <!-- Bottom status bar -->
    <rect x="100" y="365" width="440" height="60" rx="10" fill="url(#card-surface)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="115" y="380" width="8" height="8" rx="2" fill="#22c55e"/>
    <rect x="130" y="378" width="100" height="12" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="250" y="378" width="80" height="12" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="350" y="378" width="60" height="12" rx="2" fill="rgba(255,255,255,0.1)"/>
  </g>
  <!-- Floating accent card -->
  <g transform="translate(520, 180)" filter="url(#soft-shadow)">
    <rect width="100" height="64" rx="12" fill="#1e2433" stroke="rgba(59,108,245,0.4)" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="url(#hero-accent)" opacity="0.9"/>
    <rect x="42" y="18" width="48" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>
    <rect x="42" y="32" width="36" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="16" y="48" width="68" height="6" rx="2" fill="#14b8a6" opacity="0.6"/>
  </g>
</svg>
